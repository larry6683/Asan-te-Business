syntax = "proto3";

package beneficiary;

import "error/error.proto";

// ✅ UPDATED: Added detailed fields
message Beneficiary {
    string id = 1;
    string beneficiary_name = 2;
    string email = 3;
    string website_url = 4;
    string phone_number = 5;
    string location_city = 6;
    string location_state = 7;
    string ein = 8;
    string beneficiary_description = 9;
    string beneficiary_size = 10;
    string shop_url = 11;                   // 🆕 Added
    repeated string social_media_links = 12; // 🆕 Added
    repeated Cause causes = 13;             // 🆕 Added
}

// 🆕 Added Cause message definition for Beneficiary
message Cause {
    string name = 1;
    string rank = 2; 
}

message GetBeneficiaryRequest {
    string beneficiary_id = 1;
}

message GetBeneficiaryResponse {
    Beneficiary beneficiary = 1;
    repeated error.Error errors = 2;
}

message GetBeneficiaryByUserEmailRequest {
    string user_email = 1;
}

message GetBeneficiaryByUserEmailResponse {
    Beneficiary beneficiary = 1;
    bool has_beneficiary = 2;
    repeated error.Error errors = 3;
}

message CreateBeneficiaryRequest {
    string beneficiary_name = 1;
    string email = 2;
    string website_url = 3;
    string phone_number = 4;
    string location_city = 5;
    string location_state = 6;
    string ein = 7;
    string beneficiary_description = 8;
    string beneficiary_size = 9;
    string user_email = 10;
    repeated string cause_codes = 11;
    string shop_url = 12;                   // 🆕 Added
    repeated string social_media_links = 13; // 🆕 Added
}

message CreateBeneficiaryResponse {
    Beneficiary beneficiary = 1;
    repeated error.Error errors = 2;
}

service BeneficiaryService {
    rpc GetBeneficiary(GetBeneficiaryRequest) returns (GetBeneficiaryResponse);
    rpc GetBeneficiaryByUserEmail(GetBeneficiaryByUserEmailRequest) returns (GetBeneficiaryByUserEmailResponse);
    rpc CreateBeneficiary(CreateBeneficiaryRequest) returns (CreateBeneficiaryResponse);
}